<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Treasure Grid</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🗺️ Treasure Grid</h1>
    <p class="subtitle">A turn-based multiplayer treasure hunt</p>
  </header>

  <main>
    <section id="screen-home" class="screen active">
      <div class="card">
        <label for="name-input">Your name</label>
        <input id="name-input" type="text" maxlength="20" placeholder="Enter your name" />

        <div class="button-row">
          <button id="create-btn" class="primary">Create Room</button>
        </div>

        <div class="divider">or</div>

        <div class="button-row">
          <input id="code-input" type="text" maxlength="4" placeholder="ROOM CODE" style="text-transform:uppercase" />
          <button id="join-btn">Join Room</button>
        </div>

        <p id="home-error" class="error"></p>
      </div>
    </section>

    <section id="screen-lobby" class="screen">
      <div class="card">
        <h2>Room <span id="lobby-code"></span></h2>
        <p>Share this code with friends so they can join.</p>

        <div id="host-settings" class="host-settings" hidden>
          <label>Grid size
            <input id="grid-size-input" type="number" min="5" max="15" value="8" />
          </label>
          <label>Treasures
            <input id="treasure-count-input" type="number" min="1" value="10" />
          </label>
        </div>

        <h3>Players</h3>
        <ul id="player-list" class="player-list"></ul>

        <button id="start-btn" class="primary" hidden>Start Game</button>
        <p id="lobby-hint" class="hint"></p>
      </div>
    </section>

    <section id="screen-game" class="screen">
      <div class="game-header">
        <div id="turn-banner" class="turn-banner"></div>
        <div id="scoreboard" class="scoreboard"></div>
      </div>
      <canvas id="grid-canvas"></canvas>
      <p id="treasures-left" class="hint"></p>
    </section>

    <section id="screen-finished" class="screen">
      <div class="card">
        <h2>🏆 Game Over</h2>
        <ol id="final-scores" class="player-list"></ol>
        <button id="rematch-btn" class="primary" hidden>Play Again</button>
        <p id="finished-hint" class="hint"></p>
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
